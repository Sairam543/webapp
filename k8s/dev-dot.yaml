apiversion: apps/v1
kind: deployment
metadata:
   name: login
   namespace: dev
spec:
  replicas: 1
  selector:
      matchlabels:
         app: login 
  template:
    metadata:
      labels:
         app: login
    spec:
      container:
      name: nginx
      image: ravi2krishna/login-2436:student
      ports:
      - containerport: 80
---
apiVersion: v1
kind: Service
metadata:
  name: login-svc
  namespace: dev
spec:
  type: NodePort
  selector:
    app: login
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
    